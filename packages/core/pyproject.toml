[project]
name = "shot-core"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
# Deliberately light. The voice worker forks a subprocess per job and pays import
# cost at initialize_process_timeout (10s), so it must be able to import
# shot_core.settings without dragging in dbos/anthropic/sqlalchemy at module scope.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
# Only the supervisor needs these. Imported by shot_core.db, never by settings.
db = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2", "alembic>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
