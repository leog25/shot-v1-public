[project]
name = "shot-voice"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
# livekit-agents and livekit-plugins-openai MUST stay on the identical version.
# <1.5.12 drops audio messages from gpt-realtime-2.x, producing 5-20s of dead air.
dependencies = [
    "shot-core",
    "livekit-agents[mcp]==1.7.1",
    "livekit-plugins-openai==1.7.1",
    "livekit-plugins-deepgram==1.7.1",  # AMD's STT; see R1
    "httpx>=0.27",
]

[tool.uv.sources]
shot-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
