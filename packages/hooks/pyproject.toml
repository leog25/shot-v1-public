[project]
name = "shot-hooks"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
# Stateless Cloud Run receiver. No DB, no shot-core. Stays ~80 lines forever.
# anthropic[webhooks] is mandatory: unwrap() raises without standardwebhooks.
dependencies = [
    "anthropic[webhooks]>=1.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-cloud-tasks>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
